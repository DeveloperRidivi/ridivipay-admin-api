# LOCAL PROFILE PROPERTIES
server.http2.enabled                                =true
server.port                                         =${PORT:8080}
server.error.include-message                        =always
spring.config.import                                =optional:file:./local.properties
spring.devtools.restart.trigger-file                =.restartTriggerFile
spring.docker.compose.enabled                       =true
spring.docker.compose.file                          =compose-local.yml
# SECURITY
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:9090/realms/ridivi-iabs
spring.security.oauth2.resourceserver.jwk-set-uri   =http://keycloak:9090/realms/ridivi-iabs/protocol/openid-connect/certs
jwt.auth.converter.principle-attribute              =preferred_username
jwt.auth.converter.resource-id                      =ridivipay-admin-api